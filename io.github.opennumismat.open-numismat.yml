app-id: io.github.opennumismat.open-numismat
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: open-numismat
rename-icon: open-numismat
rename-desktop-file: open-numismat.desktop
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=home
  - --filesystem=/media      # for export to mobile
  - --filesystem=/run/media  # for export to mobile
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=TMPDIR=/var/tmp
cleanup:
  - /include
  - /lib/pkgconfig
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - python3-requirements.json

  # Required dependencies provided in python3-requirements.yaml
  - name: python3-imagehash
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app --no-deps .
    sources:
      - type: git
        url: https://github.com/OpenNumismat/imagehash.git
        commit: c4cf6a777f7e9c414e7f30b558130c5b2a98297f

  - name: open-numismat
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app --no-deps .
      - desktop-file-edit --set-key=Exec --set-value=open-numismat open-numismat.desktop
      - install -Dm644 open-numismat.desktop -t /app/share/applications/
      - install -Dm644 open-numismat.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 io.github.opennumismat.open-numismat.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/OpenNumismat/open-numismat.git
        tag: 1.10.6
        commit: f533ecc39e0f44842bb92d9308d0b536d91830c7
        x-checker-data:
          type: json
          url: https://api.github.com/repos/OpenNumismat/open-numismat/releases/latest
          tag-query: .tag_name
          version-query: $tag
          timestamp-query: .published_at
